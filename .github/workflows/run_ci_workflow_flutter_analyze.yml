# The default analyze of a public dart repository, from tekartik/ci.dart
# (.github/workflows/run_ci_workflow_flutter_analyze.yml, see its README):
# analyze after pub get and after pub downgrade (published constraints,
# pubspec_overrides.yaml ignored), each step being a separate job. The
# flutter sdk analyzes pure dart packages too.
name: Run CI workflow flutter analyze
on:
  push:
    branches: ['**'] # Not on tag pushes
    paths-ignore: ['**.md'] # Not on doc only changes
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # every sunday at midnight

jobs:
  ci:
    name: Run ci
    uses: tekartik/ci.dart/.github/workflows/run_ci_flutter_analyze_jobs.yml@v1
